minimum_pre_commit_version: '4.7.0'
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: uv-lock
        name: Verify uv lockfile
        entry: just check-lock
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock|uv\.toml|scripts/uv_pypi\.py|justfile|\.pre-commit-config\.yaml)$'
      - id: quantinuum-pins
        name: Verify Quantinuum pins
        entry: just check-pins
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock|README\.md|scripts/quantinuum_pins\.py)$'
