# The oldest uv that writes uv.lock with the current version and revision fields,
# so that older uv versions cannot rewrite the lockfile in an older format.
required-version = ">=0.12.22"

# PyPI is listed as an ordinary (not default) index, with the first-index
# strategy, so that it takes priority over user-level indexes and strategies
# even when uv merges them into this configuration.
index-strategy = "first-index"

[[index]]
name = "pypi"
url = "https://pypi.org/simple"

[pip]
index-strategy = "first-index"
