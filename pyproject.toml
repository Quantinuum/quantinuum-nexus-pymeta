[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "quantinuum-nexus"
version = "26.1.0"
description = "Quantinuum's Python development tools"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "guppylang==1.2.1",
    "guppyft==0.6.1",
    "guppyalgos==0.2.0",
    "selene-sim==0.3.8",
    "pytket==2.18.5",
    "qnexus==0.51.4",
]

[dependency-groups]
automation = ["ghapi==2.1.5"]
dev = [
    {include-group = "automation"},
    "pytest==9.2.0",
    "pre-commit==4.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/scripts"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md"]
