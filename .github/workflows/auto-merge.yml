name: Merge tested updates

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: merge-tested-updates
  cancel-in-progress: false
  queue: max

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The HUGRBOT_PAT repository secret is required."
            exit 1
          fi
      # workflow_run checks out the default branch, never the PR branch.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.5'
      - name: Approve and merge tested updates
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/auto_merge.py
