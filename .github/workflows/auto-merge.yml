name: Merge tested updates

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: merge-tested-updates
  cancel-in-progress: false
  queue: max

jobs:
  merge:
    if: >-
      vars.RELEASE_APP_CLIENT_ID != '' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # workflow_run checks out the default branch, never the PR branch.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.5'
      - name: Approve and merge tested updates
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/auto_merge.py
