name: Maintain release series

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/scripts/**'
      - '.github/templates/**'
      - '.github/workflows/**'
  release:
    types: [published]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintain-release-series
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.5'
      - name: Prepare release branches and update dependency targets
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/maintain_releases.py
