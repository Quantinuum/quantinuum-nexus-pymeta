name: Release Please

on:
  push:
    branches: ['release/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  policy:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.5'
      - name: Check series support and branch version
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/release_policy.py

  release:
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    needs: policy
    if: needs.policy.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The HUGRBOT_PAT repository secret is required."
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.HUGRBOT_PAT }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.5'
      - name: Validate the draft release
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
          WORKFLOW_DISPATCH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/dispatch_release.py
