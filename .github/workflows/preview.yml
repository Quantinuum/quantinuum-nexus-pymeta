name: Release preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check release token
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The HUGRBOT_PAT repository secret is required."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HUGRBOT_PAT }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.5'
      - name: Create the next beta or RC
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
          WORKFLOW_DISPATCH_TOKEN: ${{ github.token }}
          PREVIEW_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/release_series.py preview
