name: Release review

on:
  pull_request:
    branches: ['release/*']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Reviews re-run this check through release-review-refresh.yml, so the PR
  # keeps a single Release review status.

permissions:
  contents: read

concurrency:
  group: release-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Release review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.10'
      - name: Require approval unless the PR is an eligible patch update
        env:
          GH_TOKEN: ${{ github.token }}
          # The account that owns HUGRBOT_PAT and opens release-branch PRs.
          RELEASE_BOT: hugrbot
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/release_review.py
