name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        default: ''

permissions:
  contents: read

# A new push to a pull request cancels its superseded run. Merge-queue,
# dispatched, and release-validation runs get unique groups and are never
# cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-versions:
    runs-on: ubuntu-latest
    outputs:
      oldest: ${{ steps.matrix.outputs.oldest }}
      newest: ${{ steps.matrix.outputs.newest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: matrix
        run: python scripts/python_matrix.py >> "$GITHUB_OUTPUT"

  dependency-freeze:
    name: Dependency freeze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Release branches compare against their RC tag.
          fetch-depth: ${{ startsWith(github.base_ref, 'release/') && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.10'
      - name: Keep an unreleased stable version identical to its RC
        if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/release_series.py verify-promotion --unreleased
      - name: Hold Renovate dependency updates to main during the RC freeze
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/dependency_freeze.py
      - name: Check the preview selection
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/release_series.py check-preview

  quantinuum-pins:
    name: Quantinuum pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact, documented pins for Quantinuum packages in uv.lock
        run: python scripts/quantinuum_pins.py

  install:
    needs: python-versions
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      OLDEST: ${{ needs.python-versions.outputs.oldest }}
      NEWEST: ${{ matrix.newest || needs.python-versions.outputs.newest }}
    strategy:
      fail-fast: false
      # One job per platform tests the oldest and newest supported Python in turn.
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel, windows-latest]
        include:
          # Python 3.14 is not supported on Intel macOS.
          - os: macos-26-intel
            newest: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: |
            ${{ env.OLDEST }}
            ${{ env.NEWEST }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.10'
      - name: Verify lockfile
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/uv_pypi.py lock --check
      - name: Test repository scripts
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/tasks.py scripts 3.12
      - name: Test package installation
        run: python scripts/tasks.py package ${{ env.OLDEST }} ${{ env.NEWEST }}

  required:
    name: Installation checks
    if: always()
    needs: [python-versions, dependency-freeze, quantinuum-pins, install]
    runs-on: ubuntu-latest
    steps:
      - name: Require the whole matrix to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
