name: Promote quarterly RC

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Successfully published RC tag (for example v2026.2.0rc1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-quarterly-release
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.5'
      - name: Open or update the quarterly promotion PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python scripts/uv_pypi.py run --locked --only-group automation python scripts/quarterly_release.py promote "$CANDIDATE"
