name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Successfully published RC tag (for example v26.2.0rc1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-release-series
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The HUGRBOT_PAT repository secret is required."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.HUGRBOT_PAT }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.10'
      - name: Open or update the release series promotion PR
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
          CANDIDATE: ${{ inputs.candidate }}
        run: uv run --locked --only-group automation python scripts/release_series.py promote "$CANDIDATE"
