name: Renovate

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [renovate.json]
  # Checking a box in the Dependency Dashboard requests an immediate run.
  issues:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Renovate edits the dashboard on every run; only react to other users' edits.
    if: >-
      github.event_name != 'issues' || (
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.sender.login != github.event.issue.user.login
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check Renovate token
        env:
          GH_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The HUGRBOT_PAT repository secret is required."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.10'
      # A new series is added once its .0 is published, so dependency updates
      # cannot change a promoted RC before its first stable release.
      - name: Select main and the supported release series
        id: branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --only-group automation python scripts/renovate_branches.py
      - uses: renovatebot/github-action@v48.0.0
        with:
          token: ${{ secrets.HUGRBOT_PAT }}
          renovate-version: '45'
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Overrides the main-only default in renovate.json.
          RENOVATE_FORCE: ${{ steps.branches.outputs.force }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          # The owner of HUGRBOT_PAT, instead of Renovate's default Mend account.
          RENOVATE_GIT_AUTHOR: 'hugrbot <170723698+hugrbot@users.noreply.github.com>'
          LOG_LEVEL: info
