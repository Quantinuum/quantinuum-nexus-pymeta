version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule:
      interval: daily
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      tools:
        patterns:
          - guppylang
          - guppyft
          - guppyalgos
          - selene-sim
          - pytket
          - qnexus
        update-types: [minor, patch]
      development-and-automation:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: guppyft
        update-types: ['version-update:semver-minor']
      - dependency-name: guppyalgos
        update-types: ['version-update:semver-minor']
      - dependency-name: selene-sim
        update-types: ['version-update:semver-minor']
      - dependency-name: qnexus
        update-types: ['version-update:semver-minor']
  - package-ecosystem: uv
    directory: /
    target-branch: next
    schedule:
      interval: daily
    commit-message:
      prefix: feat
      prefix-development: chore
      include: scope
    groups:
      tools-next:
        patterns:
          - guppylang
          - guppyft
          - guppyalgos
          - selene-sim
          - pytket
          - qnexus
        update-types: [major, minor, patch]
      development-and-automation:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
