version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule:
      interval: daily
    commit-message:
      prefix: feat
      prefix-development: chore
      include: scope
    groups:
      tools-development:
        patterns:
          - guppylang
          - guppyft
          - guppyalgos
          - selene-sim
          - pytket
          - qnexus
        update-types: [major, minor, patch]
      development-and-automation:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
